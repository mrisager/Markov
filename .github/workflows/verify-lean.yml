name: Verify Theorems 1 and 12

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source snapshot
        run: python3 scripts/verify.py --check-only
      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependency cache
        run: lake exe cache get
      - name: Compile sources and audit axioms
        run: python3 scripts/verify.py
